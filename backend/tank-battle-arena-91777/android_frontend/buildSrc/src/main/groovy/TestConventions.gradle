import org.gradle.api.tasks.testing.Test

allprojects { proj ->
    proj.tasks.withType(Test).configureEach { Test t ->
        t.failOnNoTests = false
        t.testLogging {
            events "PASSED", "FAILED", "SKIPPED", "STANDARD_OUT", "STANDARD_ERROR"
        }
        // Force-discover common smoke tests if CI has odd filters
        t.include("**/SmokeUnitTest.class", "**/KotlinSmokeUnitTest.class")
    }
}
