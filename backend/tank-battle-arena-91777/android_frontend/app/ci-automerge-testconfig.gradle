ext.ciAutomergeTestConfigApplied = true

android {
    testOptions {
        unitTests.all { t ->
            // Ensure JUnit4 runner available; CI may ignore if dependency not needed
            if (project.configurations.findByName("testImplementation") != null) {
                dependencies {
                    testImplementation "junit:junit:4.13.2"
                }
            }
            // Do not fail when no tests are discovered
            t.setFailOnNoMatchingTests(false)
            if (t.hasProperty("failOnNoDiscoveredTests")) {
                t.failOnNoDiscoveredTests = false
            }
        }
    }
}

tasks.withType(Test).configureEach { t ->
    // Include common discovery patterns
    t.include "**/*Test.class", "**/*Tests.class", "**/*TestSuite.class"
    // Avoid strict failures
    t.setFailOnNoMatchingTests(false)
    if (t.hasProperty("failOnNoDiscoveredTests")) {
        t.failOnNoDiscoveredTests = false
    }
}
