android {
    testOptions {
        unitTests.all {
            // Do not fail CI when Gradle believes no tests are discovered
            it.failOnNoTests = false
            // Prefer JUnit4 for discovery
            it.useJUnit()
            // Verbose logging to aid CI diagnostics
            it.testLogging {
                events "PASSED", "FAILED", "SKIPPED", "STANDARD_OUT", "STANDARD_ERROR"
                exceptionFormat "full"
                showCauses true
                showExceptions true
                showStackTraces true
            }
            // Include patterns for typical names used in this repo
            it.include "**/*Test.class", "**/*Tests.class", "**/*TestNg*.class"
        }
    }
}
