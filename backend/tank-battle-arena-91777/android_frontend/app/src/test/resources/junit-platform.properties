# Enable both JUnit Jupiter (5) and Vintage (4) engines to maximize discovery
junit.platform.listeners.default.config.enabled=true
junit.platform.discovery.include.engines=junit-jupiter,junit-vintage

# Include common class name patterns
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$DisplayName
junit.platform.discovery.select-classname-patterns=.*Test|.*Tests|.*TestSuite

# Prevent build failures if a particular selector finds none (best-effort where supported)
junit.platform.execution.listeners.dependency.set.default=true
