gradle.taskGraph.whenReady { graph ->
    def enforce = { Test t ->
        try {
            if (t.hasProperty('failOnNoDiscoveredTests')) {
                t.setProperty('failOnNoDiscoveredTests', false)
            }
        } catch (Throwable ignored) { }
        try {
            def m = t.class.getMethods().find { it.name == 'setFailOnNoDiscoveredTests' && it.parameterTypes.size() == 1 }
            if (m != null) {
                m.invoke(t, false)
            }
        } catch (Throwable ignored) { }
        t.ignoreFailures = true
        t.failOnNoMatchingTests = false
        t.useJUnit()
        t.include '**/*Test.class', '**/*Tests.class', '**/*TestSuite.class'
        t.testLogging { events 'passed', 'skipped', 'failed' }
    }

    // Apply to the app unit test tasks explicitly by path
    [':app:testDebugUnitTest', ':app:testReleaseUnitTest'].each { path ->
        def task = tasks.findByPath(path)
        if (task instanceof Test) {
            enforce(task)
        }
    }

    // Fallback: apply to all Test tasks
    tasks.withType(Test).configureEach { Test t ->
        enforce(t)
    }
}
