pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

plugins {
    id("com.android.application") version "8.2.2" apply false
    id("org.jetbrains.kotlin.android") version "1.9.24" apply false
}

gradle.settingsEvaluated {
    apply from: "${rootDir}/ci-all-tests.gradle"
    // Also apply app-specific test task configuration
    apply from: "${rootDir}/app/build.apply-ci.gradle"
    // Apply smoke tests task wiring
    apply from: "${rootDir}/app/apply-smoke-tests.gradle"
    // Apply direct configuration for specific test tasks
    apply from: "${rootDir}/app/configure-test-tasks.gradle"
    // Apply android testOptions override
    apply from: "${rootDir}/app/android-testoptions-override.gradle"
    // Apply all-modules wide Test task configuration
    apply from: "${rootDir}/all-modules-test-config.gradle"
}

rootProject.name = "TankBattleArenaAndroid"
include(":app")
include(":utilities")
include(":list")
